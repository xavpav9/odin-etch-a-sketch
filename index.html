<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8">
    <title>Etch-a-Sketch</title>
    <script defer src="./script.js"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  
  <body>
    <div id="header">
      <h1>Etch-a-Sketch</h1>
    </div>
    <div id="options">
      <button class="change-resolution">Change resolution: </button>
      <button class="change-width">Change width: </button>
      <button class="change-colour black">Toggle: </button>
      <button class="change-darken">Darkening Effect</button>
      <button class="clear-screen">Clear Screen</button>
    </div>
    <div id="grid"></div>
  </body>
</html>
